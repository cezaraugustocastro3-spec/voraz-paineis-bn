<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Black November · Michael Dietrich</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mesmo sistema da Galeria VORAZ: grafite, Bebas Neue + Inter Tight, código branco em mono, post no estilo Instagram. */
:root{--bg:#303030;--surface:#3a3a3a;--line:#525252;--fg:#f2f2f2;--muted:#b8b8b8;--a:#C40602;--ig:#000;--igl:#262626;--display:"Bebas Neue",Impact,sans-serif;--body:"Inter Tight",system-ui,-apple-system,sans-serif;--r:6px;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header .w,main{max-width:520px;margin:0 auto}
header small{font:400 18px/1 var(--display);letter-spacing:.06em;color:var(--muted)}
header small i{font-style:normal;color:var(--a)}
header h1{margin:4px 0 2px;font:400 34px/1 var(--display);letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:13px}
main{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
h2{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 4px 12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--ig);border:1px solid var(--igl);border-radius:var(--r);margin-bottom:24px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;padding:2px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.av b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--a);border:2px solid #000;font:400 13px/1 var(--display);color:#fff}
.top .t{flex:1;font-size:13px;line-height:1.25}
.top .t b{display:block;font-weight:700}
.top .t span{color:#a8a8a8;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cod{background:#fff;color:#0d0d0d;border:0;font:800 15px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em;padding:7px 9px;border-radius:4px;cursor:pointer;flex:none}
.car{position:relative;background:#000}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.trilho img{flex:0 0 100%;width:100%;scroll-snap-align:center;display:block;aspect-ratio:var(--r2);object-fit:cover;background:#111}
.cont{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#000;font-size:18px;cursor:pointer;display:none}
.seta.e{left:8px}.seta.d{right:8px}
@media(hover:hover){.car:hover .seta{display:block}}
.pts{display:flex;justify-content:center;gap:4px;padding:10px 0 0}
.pts i{width:6px;height:6px;border-radius:50%;background:#555}.pts i.on{background:#0095f6}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
button.b{font:600 14px var(--body);min-height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:8px}
button.b.p{background:var(--a);border-color:var(--a);color:#fff}
.leg{padding:0 12px 14px}
.leg textarea{width:100%;min-height:150px;font:16px/1.45 var(--body);border:1px solid var(--igl);border-radius:var(--r);padding:10px;color:#f5f5f5;background:#121212;resize:vertical}
.leg .l{display:flex;gap:8px;margin-top:8px}.leg .l button{flex:1}
.leg .l .rst{flex:0 0 auto;padding:8px 14px}
.semleg{color:#a8a8a8;font-size:13px;padding:0 12px 14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#0d0d0d;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.exp{max-width:420px;margin:80px auto;padding:24px;text-align:center}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style>
</head><body>
<header><div class="w"><small>MKR Imóveis · <i>Black November</i></small><h1>Michael Dietrich · CRECI 77.203-F</h1><p id="val"></p></div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
{
const D = {"grupos": [{"titulo": "", "itens": [{"codigo": "CA0125", "titulo": "Casa de 2 quartos com 566 m² de terreno na Itoupava Central.", "sub": "R$ 424.000", "legenda": "🏡 Casa com 566 m² de terreno na Itoupava Central, em Blumenau.\n\n🛏️ 2 quartos · 1 banheiro · 4 vagas\n🔥 Fogão a lenha e varanda coberta\n🏠 Edícula nos fundos: dá para alugar e ter renda extra\n🌳 Quintal amplo, rua sem saída e aceita pet\n📍 Mercado, posto de saúde, banco e escola perto · Norte Shopping a 5 min\n💰 R$ 424.000 · sem condomínio\n🔑 Exclusividade MKR Imóveis\n\n📲 WhatsApp: (47) 98461-5352\n📩 Ou chame no direct e peça o código CA0125.\n👤 Michael Dietrich · CRECI 77.203-F\n\n#blacknovember #blumenau #casaavenda #imoveissc #mkrimoveis", "paginas": ["img/MKR_CA0125_BlackNovember_01.jpg", "img/MKR_CA0125_BlackNovember_02.jpg", "img/MKR_CA0125_BlackNovember_03.jpg", "img/MKR_CA0125_BlackNovember_04.jpg", "img/MKR_CA0125_BlackNovember_05.jpg", "img/MKR_CA0125_BlackNovember_06.jpg", "img/MKR_CA0125_BlackNovember_07.jpg", "img/MKR_CA0125_BlackNovember_08.jpg", "img/MKR_CA0125_BlackNovember_09.jpg", "img/MKR_CA0125_BlackNovember_10.jpg"], "tipo": "feed"}, {"codigo": "CA0103", "titulo": "Casa geminada 100% térrea, com 2 quartos, no Passo Manso.", "sub": "R$ 426.000", "legenda": "🏡 Casa 100% térrea, sem nenhum degrau, no Passo Manso, em Blumenau.\n\n🛏️ 2 quartos grandes · 1 banheiro · garagem coberta\n🔥 Área de festas com churrasqueira e fogão a lenha\n🍽️ Cozinha com armários e despensa\n🌳 Quintal, aceita pet e sem condomínio\n📍 Rua sem saída, perto de padaria, farmácia, mercados e Komprão\n💰 R$ 426.000 · aceita financiamento\n🔑 Exclusividade MKR Imóveis\n\n📲 WhatsApp: (47) 98461-5352\n📩 Ou chame no direct e peça o código CA0103.\n👤 Michael Dietrich · CRECI 77.203-F\n\n#blacknovember #blumenau #casaavenda #imoveissc #mkrimoveis", "paginas": ["img/MKR_CA0103_BlackNovember_01.jpg", "img/MKR_CA0103_BlackNovember_02.jpg", "img/MKR_CA0103_BlackNovember_03.jpg", "img/MKR_CA0103_BlackNovember_04.jpg", "img/MKR_CA0103_BlackNovember_05.jpg", "img/MKR_CA0103_BlackNovember_06.jpg", "img/MKR_CA0103_BlackNovember_07.jpg", "img/MKR_CA0103_BlackNovember_08.jpg", "img/MKR_CA0103_BlackNovember_09.jpg", "img/MKR_CA0103_BlackNovember_10.jpg"], "tipo": "feed"}, {"codigo": "CA0106", "titulo": "Casa térrea de 3 quartos com 8 vagas na Água Verde.", "sub": "R$ 749.000", "legenda": "🏡 Casa térrea com 8 vagas e 420 m² de terreno na Água Verde, em Blumenau.\n\n🛏️ 3 quartos, sendo 1 suíte · 2 banheiros\n🏠 Tudo num piso só: casa plana, sem escadas\n🍽️ Sala e cozinha integradas, com móveis sob medida\n🔥 Área de festas com churrasqueira e varanda\n🚗 8 vagas em terreno plano, com portão eletrônico\n📍 Perto do Terminal da Água Verde, Komprão, mercados e creche\n💰 R$ 749.000 · aceita permuta por imóvel menor, apartamento ou chácara\n🔑 Exclusividade MKR Imóveis\n\n📲 WhatsApp: (47) 98461-5352\n📩 Ou chame no direct e peça o código CA0106.\n👤 Michael Dietrich · CRECI 77.203-F\n\n#blacknovember #blumenau #casaavenda #imoveissc #mkrimoveis", "paginas": ["img/MKR_CA0106_BlackNovember_01.jpg", "img/MKR_CA0106_BlackNovember_02.jpg", "img/MKR_CA0106_BlackNovember_03.jpg", "img/MKR_CA0106_BlackNovember_04.jpg", "img/MKR_CA0106_BlackNovember_05.jpg", "img/MKR_CA0106_BlackNovember_06.jpg", "img/MKR_CA0106_BlackNovember_07.jpg", "img/MKR_CA0106_BlackNovember_08.jpg", "img/MKR_CA0106_BlackNovember_09.jpg", "img/MKR_CA0106_BlackNovember_10.jpg"], "tipo": "feed"}, {"codigo": "SO0025", "titulo": "Sobrado de 2 suítes na Velha, em Blumenau.", "sub": "R$ 499.999", "legenda": "🏡 Sobrado na Velha, Blumenau, por R$ 499.999.\n🔻 Era R$ 514.000: são R$ 14.001 a menos no Black November.\n\n✨ 110 m², terreno de cerca de 112 m²\n🛏️ 2 suítes (uma com sacada) + lavabo\n🍽️ Sala e cozinha integradas, com escada flutuante\n🛠️ Cozinha e banheiros com móveis sob medida\n✅ Porcelanato e gesso em todo o imóvel, lareira e despensa\n🌿 Quintal com pergolado\n🚗 2 vagas (uma coberta) e portão eletrônico\n💰 Sem condomínio · aceita financiamento\n\n📍 Perto das ruas dos Caçadores, General Osório e Humberto de Campos: Milium a 250 m, Escola Alberto Stein a 350 m, Rede Top a 450 m, Cooper a 650 m e Ailos a 1 km.\n🛣️ A Rua dos Caçadores foi revitalizada: mais de 3 km de asfalto novo, R$ 9,6 milhões, liberada em julho de 2025 (fonte: ndmais, 15/08/2025).\n\n📩 Quer ver por dentro? Chame no direct e agende sua visita.\n\nCódigo SO0025 | MKR Imóveis | CRECI 5582J\n\n#imoveisblumenau #blumenau #bairrovelha #sobradoblumenau #mkrimoveis", "paginas": ["img/MKR_SO0025_BlackNovember_01.jpg", "img/MKR_SO0025_BlackNovember_02.jpg", "img/MKR_SO0025_BlackNovember_03.jpg", "img/MKR_SO0025_BlackNovember_04.jpg", "img/MKR_SO0025_BlackNovember_05.jpg", "img/MKR_SO0025_BlackNovember_06.jpg", "img/MKR_SO0025_BlackNovember_07.jpg", "img/MKR_SO0025_BlackNovember_08.jpg", "img/MKR_SO0025_BlackNovember_09.jpg", "img/MKR_SO0025_BlackNovember_10.jpg"], "tipo": "feed"}]}], "ratio": "4/5"};
const ATE = new Date("2026-11-20T23:59:59-03:00");
const app = document.getElementById("app"), toast = document.getElementById("toast");
const fmt = ATE.toLocaleDateString("pt-BR");
function aviso(t){toast.textContent=t;toast.classList.add("on");clearTimeout(aviso.t);aviso.t=setTimeout(()=>toast.classList.remove("on"),1800)}
if (Date.now() > ATE.getTime()) {
  app.innerHTML = '<div class="exp"><h2>Este link expirou</h2><p>O painel ficou disponível até ' + fmt + '. Peça um novo link à equipe de marketing.</p></div>';
} else {
  document.getElementById("val").textContent = "Disponível até " + fmt + " · toque e segure a imagem ou use os botões";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let html = "";
  D.grupos.forEach((g, gi) => {
    if (g.titulo) html += "<h2>" + esc(g.titulo) + "</h2>";
    g.itens.forEach((it, ii) => {
      const id = gi + "-" + ii, n = it.paginas.length;
      html += '<section class="card" data-id="' + id + '" style="--r2:' + (it.tipo === "story" ? "9/16" : (D.ratio || "4/5")) + '">' +
        '<div class="top"><span class="av"><b>MKR</b></span><div class="t"><b>mkrimoveis</b><span>' + esc(it.titulo || "") + ' · ' + esc(it.sub || "") + '</span></div><button class="cod" data-c="' + esc(it.codigo) + '" title="Copiar código">' + esc(it.codigo) + '</button></div>' +
        '<div class="car"><div class="trilho">' + it.paginas.map((p, k) => '<img src="' + p + '" alt="' + esc(it.codigo) + ' página ' + (k + 1) + '" loading="' + (k < 1 ? "eager" : "lazy") + '" decoding="async">').join("") + '</div>' +
        (n > 1 ? '<span class="cont">1/' + n + '</span><button class="seta e" aria-label="Anterior">‹</button><button class="seta d" aria-label="Próxima">›</button>' : '') + '</div>' +
        (n > 1 ? '<div class="pts">' + it.paginas.map((_, k) => '<i' + (k ? '' : ' class="on"') + '></i>').join("") + '</div>' : '') +
        '<div class="acoes"><button class="b um">Salvar esta</button><button class="b p todas">' + (n > 1 ? 'Salvar todas (' + n + ')' : 'Compartilhar') + '</button></div>' +
        (it.legenda ? '<div class="leg"><textarea aria-label="Legenda ' + esc(it.codigo) + '"></textarea><div class="l"><button class="b p cp">Copiar legenda</button><button class="b rst">Original</button></div></div>' : '<p class="semleg">Story sem legenda.</p>') +
        '</section>';
    });
  });
  app.innerHTML = html;
  const itens = D.grupos.flatMap(g => g.itens);
  const arquivos = {};
  async function carregar(id, it) {
    if (!arquivos[id]) arquivos[id] = Promise.all(it.paginas.map(async p => {
      const r = await fetch(p); const b = await r.blob();
      return new File([b], p.split("/").pop(), {type: "image/jpeg"});
    })).catch(e => { delete arquivos[id]; throw e; });
    return arquivos[id];
  }
  function baixar(files) {
    files.forEach((f, k) => setTimeout(() => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }, k * 350));
  }
  async function enviar(files, it) {
    if (navigator.canShare && navigator.canShare({files})) {
      try { await navigator.share({files, title: it.codigo}); } catch (e) { if (e.name !== "AbortError") baixar(files); }
    } else { baixar(files); aviso(files.length > 1 ? "Baixando " + files.length + " imagens" : "Baixando imagem"); }
  }
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { const id = e.target.dataset.id; carregar(id, itens[[...document.querySelectorAll(".card")].indexOf(e.target)]).catch(() => {}); obs.unobserve(e.target); }
  }), {rootMargin: "400px"});
  document.querySelectorAll(".card").forEach((c, idx) => {
    const it = itens[idx], id = c.dataset.id, tr = c.querySelector(".trilho"), n = it.paginas.length;
    obs.observe(c);
    const atual = () => Math.round(tr.scrollLeft / tr.clientWidth);
    if (n > 1) {
      const cont = c.querySelector(".cont"), pts = c.querySelectorAll(".pts i");
      tr.addEventListener("scroll", () => { const k = atual(); cont.textContent = (k + 1) + "/" + n; pts.forEach((p, j) => p.classList.toggle("on", j === k)); }, {passive: true});
      c.querySelector(".e").onclick = () => tr.scrollBy({left: -tr.clientWidth, behavior: "smooth"});
      c.querySelector(".d").onclick = () => tr.scrollBy({left: tr.clientWidth, behavior: "smooth"});
    }
    c.querySelector(".cod").onclick = () => copiar(it.codigo, "Código " + it.codigo + " copiado");
    c.querySelector(".um").onclick = async () => { try { const f = await carregar(id, it); enviar([f[atual()]], it); } catch (e) { aviso("Sem conexão. Tente de novo."); } };
    c.querySelector(".todas").onclick = async () => { try { enviar(await carregar(id, it), it); } catch (e) { aviso("Sem conexão. Tente de novo."); } };
    const ta = c.querySelector("textarea");
    if (ta) {
      const k = "leg:" + location.pathname + ":" + it.codigo;
      let salvo = null; try { salvo = localStorage.getItem(k); } catch (e) {}
      ta.value = salvo || it.legenda;
      ta.addEventListener("input", () => { try { localStorage.setItem(k, ta.value); } catch (e) {} });
      c.querySelector(".cp").onclick = () => copiar(ta.value, "Legenda copiada");
      c.querySelector(".rst").onclick = () => { ta.value = it.legenda; try { localStorage.removeItem(k); } catch (e) {} aviso("Legenda original"); };
    }
  });
  async function copiar(t, msg) {
    try { await navigator.clipboard.writeText(t); aviso(msg); }
    catch (e) { const x = document.createElement("textarea"); x.value = t; x.setAttribute("readonly", ""); x.style.position = "fixed"; x.style.opacity = "0"; document.body.appendChild(x); x.select(); x.setSelectionRange(0, t.length); try { document.execCommand("copy"); aviso(msg); } catch (_) { aviso("Não deu para copiar"); } x.remove(); }
  }
}
}
</script></body></html>

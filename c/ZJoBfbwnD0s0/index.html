<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Black November · Sodré</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#C40602;--bg:#f3f3f1;--ink:#0e1330;--mut:#6b6f80;--line:#dedfe4;--card:#fff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--ink);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}
header .w,main{max-width:560px;margin:0 auto}
header small{opacity:.7;font-weight:700}
header h1{margin:4px 0 2px;font-size:26px;line-height:1.1;font-weight:800}
header p{margin:0;opacity:.75;font-size:14px}
main{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
h2{font-size:15px;margin:22px 6px 10px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.cod{font-weight:800;font-size:14px;background:var(--a);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-family:inherit;cursor:pointer}
.top .t{flex:1;font-size:14px;line-height:1.3}
.top .t b{display:block}
.top .t span{color:var(--mut);font-size:13px}
.car{position:relative;background:#111}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.trilho img{flex:0 0 100%;width:100%;scroll-snap-align:center;display:block;aspect-ratio:var(--r);object-fit:cover;background:#222}
.cont{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:18px;cursor:pointer;display:none}
.seta.e{left:8px}.seta.d{right:8px}
@media(hover:hover){.car:hover .seta{display:block}}
.pts{display:flex;justify-content:center;gap:4px;padding:10px 0 2px}
.pts i{width:6px;height:6px;border-radius:50%;background:#c9cad2}.pts i.on{background:var(--a)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
button.b{font:700 15px Manrope,system-ui,sans-serif;min-height:46px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;padding:8px}
button.b.p{background:var(--ink);color:#fff}
button.b:disabled{opacity:.5}
.leg{padding:4px 14px 16px}
.leg textarea{width:100%;min-height:150px;font:15px/1.45 Manrope,system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);resize:vertical;background:#fafafa}
.leg .l{display:flex;gap:8px;margin-top:8px}.leg .l button{flex:1}
.leg .rst{flex:0 0 auto;padding:8px 14px}
.semleg{color:var(--mut);font-size:14px;padding:0 14px 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.exp{max-width:420px;margin:80px auto;padding:24px;text-align:center}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style></head><body>
<header><div class="w"><small>MKR Imóveis · Black November</small><h1>Sodré · CRECI 71.896-F</h1><p id="val"></p></div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
{
const D = {"grupos": [{"titulo": "", "itens": [{"codigo": "CA0124", "titulo": "Casa de 4 quartos com 955 m² de terreno na Itoupava Norte.", "sub": "R$ 899.000", "legenda": "🏡 Casa com 955 m² de terreno na Itoupava Norte, em Blumenau.\n\n🛏️ 4 quartos, sendo 2 suítes · 4 banheiros · 358 m² em 3 pisos\n🏊 Terreno com preparação para instalar piscina\n🔥 Área de festas coberta com churrasqueira, fogão a lenha e lavabo\n💻 Sótão espaçoso, bom para home office\n🌳 Área de preservação aos fundos: o verde sempre por perto\n🚗 Garagem coberta para até 3 carros\n💰 R$ 899.000 · aceita financiamento · estuda permuta de menor valor\n🔑 Exclusividade MKR Imóveis\n\n📲 WhatsApp: (47) 99767-4644\n📩 Ou chame no direct e peça o código CA0124.\n👤 Sodré · CRECI 71.896-F\n\n#blacknovember #blumenau #casaavenda #imoveissc #mkrimoveis", "paginas": ["img/MKR_CA0124_BlackNovember_01.jpg", "img/MKR_CA0124_BlackNovember_02.jpg", "img/MKR_CA0124_BlackNovember_03.jpg", "img/MKR_CA0124_BlackNovember_04.jpg", "img/MKR_CA0124_BlackNovember_05.jpg", "img/MKR_CA0124_BlackNovember_06.jpg", "img/MKR_CA0124_BlackNovember_07.jpg", "img/MKR_CA0124_BlackNovember_08.jpg", "img/MKR_CA0124_BlackNovember_09.jpg", "img/MKR_CA0124_BlackNovember_10.jpg"], "tipo": "feed"}]}], "ratio": "4/5"};
const ATE = new Date("2026-11-20T23:59:59-03:00");
const app = document.getElementById("app"), toast = document.getElementById("toast");
const fmt = ATE.toLocaleDateString("pt-BR");
function aviso(t){toast.textContent=t;toast.classList.add("on");clearTimeout(aviso.t);aviso.t=setTimeout(()=>toast.classList.remove("on"),1800)}
if (Date.now() > ATE.getTime()) {
  app.innerHTML = '<div class="exp"><h2>Este link expirou</h2><p>O painel ficou disponível até ' + fmt + '. Peça um novo link à equipe de marketing.</p></div>';
} else {
  document.getElementById("val").textContent = "Disponível até " + fmt + " · toque e segure a imagem ou use os botões";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let html = "";
  D.grupos.forEach((g, gi) => {
    if (g.titulo) html += "<h2>" + esc(g.titulo) + "</h2>";
    g.itens.forEach((it, ii) => {
      const id = gi + "-" + ii, n = it.paginas.length;
      html += '<section class="card" data-id="' + id + '" style="--r:' + (it.tipo === "story" ? "9/16" : (D.ratio || "4/5")) + '">' +
        '<div class="top"><button class="cod" data-c="' + esc(it.codigo) + '" title="Copiar código">' + esc(it.codigo) + '</button><div class="t"><b>' + esc(it.titulo || "") + '</b><span>' + esc(it.sub || "") + '</span></div></div>' +
        '<div class="car"><div class="trilho">' + it.paginas.map((p, k) => '<img src="' + p + '" alt="' + esc(it.codigo) + ' página ' + (k + 1) + '" loading="' + (k < 1 ? "eager" : "lazy") + '" decoding="async">').join("") + '</div>' +
        (n > 1 ? '<span class="cont">1/' + n + '</span><button class="seta e" aria-label="Anterior">‹</button><button class="seta d" aria-label="Próxima">›</button>' : '') + '</div>' +
        (n > 1 ? '<div class="pts">' + it.paginas.map((_, k) => '<i' + (k ? '' : ' class="on"') + '></i>').join("") + '</div>' : '') +
        '<div class="acoes"><button class="b um">Salvar esta</button><button class="b p todas">' + (n > 1 ? 'Salvar todas (' + n + ')' : 'Compartilhar') + '</button></div>' +
        (it.legenda ? '<div class="leg"><textarea aria-label="Legenda ' + esc(it.codigo) + '"></textarea><div class="l"><button class="b p cp">Copiar legenda</button><button class="b rst">Original</button></div></div>' : '<p class="semleg">Story sem legenda.</p>') +
        '</section>';
    });
  });
  app.innerHTML = html;
  const itens = D.grupos.flatMap(g => g.itens);
  const arquivos = {};
  async function carregar(id, it) {
    if (!arquivos[id]) arquivos[id] = Promise.all(it.paginas.map(async p => {
      const r = await fetch(p); const b = await r.blob();
      return new File([b], p.split("/").pop(), {type: "image/jpeg"});
    })).catch(e => { delete arquivos[id]; throw e; });
    return arquivos[id];
  }
  function baixar(files) {
    files.forEach((f, k) => setTimeout(() => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }, k * 350));
  }
  async function enviar(files, it) {
    if (navigator.canShare && navigator.canShare({files})) {
      try { await navigator.share({files, title: it.codigo}); } catch (e) { if (e.name !== "AbortError") baixar(files); }
    } else { baixar(files); aviso(files.length > 1 ? "Baixando " + files.length + " imagens" : "Baixando imagem"); }
  }
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { const id = e.target.dataset.id; carregar(id, itens[[...document.querySelectorAll(".card")].indexOf(e.target)]).catch(() => {}); obs.unobserve(e.target); }
  }), {rootMargin: "400px"});
  document.querySelectorAll(".card").forEach((c, idx) => {
    const it = itens[idx], id = c.dataset.id, tr = c.querySelector(".trilho"), n = it.paginas.length;
    obs.observe(c);
    const atual = () => Math.round(tr.scrollLeft / tr.clientWidth);
    if (n > 1) {
      const cont = c.querySelector(".cont"), pts = c.querySelectorAll(".pts i");
      tr.addEventListener("scroll", () => { const k = atual(); cont.textContent = (k + 1) + "/" + n; pts.forEach((p, j) => p.classList.toggle("on", j === k)); }, {passive: true});
      c.querySelector(".e").onclick = () => tr.scrollBy({left: -tr.clientWidth, behavior: "smooth"});
      c.querySelector(".d").onclick = () => tr.scrollBy({left: tr.clientWidth, behavior: "smooth"});
    }
    c.querySelector(".cod").onclick = () => copiar(it.codigo, "Código " + it.codigo + " copiado");
    c.querySelector(".um").onclick = async () => { try { const f = await carregar(id, it); enviar([f[atual()]], it); } catch (e) { aviso("Sem conexão. Tente de novo."); } };
    c.querySelector(".todas").onclick = async () => { try { enviar(await carregar(id, it), it); } catch (e) { aviso("Sem conexão. Tente de novo."); } };
    const ta = c.querySelector("textarea");
    if (ta) {
      const k = "leg:" + location.pathname + ":" + it.codigo;
      let salvo = null; try { salvo = localStorage.getItem(k); } catch (e) {}
      ta.value = salvo || it.legenda;
      ta.addEventListener("input", () => { try { localStorage.setItem(k, ta.value); } catch (e) {} });
      c.querySelector(".cp").onclick = () => copiar(ta.value, "Legenda copiada");
      c.querySelector(".rst").onclick = () => { ta.value = it.legenda; try { localStorage.removeItem(k); } catch (e) {} aviso("Legenda original"); };
    }
  });
  async function copiar(t, msg) {
    try { await navigator.clipboard.writeText(t); aviso(msg); }
    catch (e) { const x = document.createElement("textarea"); x.value = t; x.setAttribute("readonly", ""); x.style.position = "fixed"; x.style.opacity = "0"; document.body.appendChild(x); x.select(); x.setSelectionRange(0, t.length); try { document.execCommand("copy"); aviso(msg); } catch (_) { aviso("Não deu para copiar"); } x.remove(); }
  }
}
}
</script></body></html>
